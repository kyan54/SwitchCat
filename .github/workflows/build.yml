name: Build SwitchCat

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test

      - name: Build application bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: ${{ matrix.args }}
          # main 分支按应用版本自动创建/更新 Release；v* 标签仍发布对应正式版本。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.ref == 'refs/heads/main' && 'v__VERSION__' || '') }}
          releaseName: SwitchCat v__VERSION__
          releaseBody: |
            SwitchCat v__VERSION__ 自动构建版本。

            本版本未使用商业代码签名证书；请仅从本仓库下载。
          releaseDraft: false
          prerelease: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchcat-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
