name: Build SwitchCat

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run check
      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test
      - name: Build application bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.ref == 'refs/heads/main' && 'v__VERSION__' || '') }}
          releaseName: SwitchCat v__VERSION__
          releaseBody: |
            SwitchCat v__VERSION__ — Windows 手动网络切换版。
            配置 IP、掩码、网关、DNS，选择目标网卡后从托盘手动切换。
            从 0.1.x 升级后，请在新配置页重新保存 config.ini。
          releaseDraft: false
          prerelease: false
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchcat-x86_64-pc-windows-msvc
          if-no-files-found: error
          path: src-tauri/target/release/bundle/**/*
