# 192.0.2.0/24 与 198.51.100.0/24 是文档专用示例网段，使用前必须全部替换。
version = 2

[app]
active_profile = "home"
auto_detect_profile = true
refresh_seconds = 60
start_at_login = true
animate_cat = true
menu_on_left_click = true

[profiles.home]
name = "家里"
enabled = true

[profiles.home.openwrt]
host = "192.0.2.3"
port = 22
user = "root"
identity_file = ""
connect_timeout_seconds = 6

[profiles.home.device]
client_ip = "192.0.2.10"
acl_remarks = "Windows"
direct_gateway = "192.0.2.1"
proxy_gateway = "192.0.2.3"
direct_dns = "192.0.2.1"
proxy_dns = "192.0.2.3"

[profiles.home.detect]
ssids = ["HomeWiFi"]
gateways = ["192.0.2.3"]
local_cidrs = ["192.0.2.0/24"]

[profiles.office]
name = "公司"
enabled = true

[profiles.office.openwrt]
host = "198.51.100.3"
port = 22
user = "root"
identity_file = ""
connect_timeout_seconds = 6

[profiles.office.device]
client_ip = "198.51.100.42"
acl_remarks = "Work-Laptop"
direct_gateway = "198.51.100.1"
proxy_gateway = "198.51.100.3"
direct_dns = "198.51.100.1"
proxy_dns = "198.51.100.3"

[profiles.office.detect]
ssids = ["OfficeWiFi"]
gateways = ["198.51.100.3"]
local_cidrs = ["198.51.100.0/24"]
